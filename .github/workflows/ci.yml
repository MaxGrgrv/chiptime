name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - name: Sync
        working-directory: python
        run: uv sync --python ${{ matrix.python }}
      - name: Lint
        working-directory: python
        run: uv run ruff check . ../corpus/tools ../scripts
      - name: Format
        working-directory: python
        run: uv run ruff format --check . ../corpus/tools ../scripts
      - name: Types
        working-directory: python
        run: uv run mypy
      - name: Corpus integrity (sha256 guards)
        run: uv run --project python python corpus/tools/gen_all.py
      - name: Tests (incl. conformance + determinism + truncation sweep)
        working-directory: python
        run: uv run pytest
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Install wheel into a clean env and smoke it
        run: |
          uv venv /tmp/smoke --python 3.11
          uv pip install --python /tmp/smoke/bin/python python/dist/*.whl
          /tmp/smoke/bin/python -c "import chiptime; print(chiptime.__version__)"
          /tmp/smoke/bin/chiptime codes | head -3
  js:
    name: js (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: js}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - name: Lint + format
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Source guards (Math.round ban — ADR-0009 §3)
        run: npm run guards
      - name: Tests (incl. CPython differential vectors)
        run: npm test
  js-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: js/package-lock.json}
      - run: npm ci
        working-directory: js
      - name: Pack, install into a clean dir, import from ESM and CJS
        run: npm run smoke
        working-directory: js
      - name: Determinism — same bytes from two separate processes, and from CPython
        working-directory: js
        run: |
          npm run build
          node scripts/determinism.mjs > /tmp/det1
          node scripts/determinism.mjs > /tmp/det2
          diff /tmp/det1 /tmp/det2
          cat /tmp/det1
  parity-vectors:
    # The differential vectors record CPython's exact output. Regenerating them here
    # means a Python-side behavior change cannot silently invalidate the contract the
    # TypeScript suite is asserting against — it fails this job instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: python
      - name: Regenerate parity vectors
        run: uv run --project python python scripts/gen_parity_vectors.py
      - name: Vectors must be unchanged
        run: git diff --exit-code -- js/test/vectors
  cross-os-determinism:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Hash all snapshots
        run: sha256sum corpus/cases/*/*/expected.json | sha256sum
      # The macOS test job parses the same corpus byte-identically (conformance
      # runner compares against these committed snapshots) — cross-OS
      # determinism is therefore enforced by the matrix, this job just makes
      # the invariant visible in the summary.
